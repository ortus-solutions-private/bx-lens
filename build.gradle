// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_packaging
plugins {
    id 'java'
    // For source code formatting
    id "com.diffplug.spotless" version "8.10.3"
	// https://github.com/harbby/gradle-serviceloader
    id "com.github.harbby.gradle.serviceloader" version "1.1.9"
	// Shadow
	id "com.gradleup.shadow" version "9.6.1"
    // Download task
    id "de.undercouch.download" version "5.7.0"
}

/**
 * Project Properties
 */
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'
}

if ( branch == 'development' ) {
    // If the branch is 'development', ensure the version ends with '-snapshot'
    // This replaces any existing prerelease identifier with '-snapshot'
    version = version.contains( '-' ) ? version.replaceAll( /-.*/, '-snapshot' ) : "${version}-snapshot"
	boxlangVersion = boxlangVersion.contains( '-' ) ? boxlangVersion.replaceAll( /-.*/, '-snapshot' ) : "${boxlangVersion}-snapshot"
}

repositories {
    mavenCentral()
    // Last, so a stray artifact in a developer's local repository can never win over the real one
    mavenLocal()
}

dependencies {
	// Look for it in the local build directory
	// You must run `./gradle build -x test` in the BoxLang project
	if ( file( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' ).exists() ) {
		compileOnly files( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' )
		testImplementation files( '../boxlang/build/libs/boxlang-' + boxlangVersion + '.jar' )
	} else {
		// Downloaded Dependencies from s3
		compileOnly files( 'src/test/resources/libs/boxlang-' + boxlangVersion + '.jar' )
		testImplementation files( 'src/test/resources/libs/boxlang-' + boxlangVersion + '.jar' )
	}
	// Web support provides the HTTP exchange. It is a runtime dependency of every web server we support, so it is compile only here.
	compileOnly files( 'src/test/resources/libs/boxlang-web-support-' + boxlangVersion + '.jar' )
	testImplementation files( 'src/test/resources/libs/boxlang-web-support-' + boxlangVersion + '.jar' )

	// Implementation Dependencies FOR THIS MODULE

	// Test Frameworks
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testImplementation "org.mockito:mockito-core:5.24.0"
	testImplementation "com.google.truth:truth:1.4.5"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}

java {
	sourceCompatibility = JavaVersion.toVersion( jdkVersion )
	targetCompatibility = JavaVersion.toVersion( jdkVersion )
	withJavadocJar()
	withSourcesJar()
}

// Exclude main resources from IDE classpath to avoid class loading conflicts
// Resources are still included in the JAR/build outputs
sourceSets {
	main {
		resources {
			// Empty the resources to exclude from IDE classpath
			srcDirs = []
		}
	}
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debug = true
}

compileTestJava{
	// Make sure the service loaders are created before testing
	dependsOn compileJava, serviceLoaderBuild
}
compileTestJava.finalizedBy( shadowJar )

/**
 * Clean up
 */
clean {
	doLast{
		var userDir = file( "${System.getProperty('user.home')}/.boxlang/classes" )
		if ( userDir.exists() ) {
			userDir.deleteDir()
			println "+ Cleared user home classes " + userDir.toString()
		}
		println "+ Clean finalized!"
	}
}

javadoc {
    // To avoid our own doclet issues
	options.addBooleanOption( "Xdoclint:none", true )
	//exclude '**/boxlang/parser/**'
	options.addBooleanOption( 'html5', true )
}
task zipJavadocs( type: Zip ) {
	group = "documentation"
	from javadoc.destinationDir
	archiveFileName = "${project.name}-javadocs-${version}.zip"
	destinationDirectory = file( "$buildDir/distributions" )
	// Output that the docs have been zippped
	doLast {
		println "+ Javadocs have been zipped to the distribution folder"
	}
}
javadoc.finalizedBy( zipJavadocs )

/**
 * Docs are here:
 * - https://github.com/harbby/gradle-serviceloader,
 * - https://plugins.gradle.org/plugin/com.github.harbby.gradle.serviceloader
 * This generates the META-INF/services files for the ServiceLoader as part of the `build` task
 */
serviceLoader {
    serviceInterface 'ortus.boxlang.runtime.bifs.BIF'
	// Collectors are registered by LensService.activate() according to the settings, not by ServiceLoader.
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'BoxLang Debug Bar Module (bx-lens)'
    }
}
// The META-INF/services files must exist before any jar is built, including when no tests are compiled
jar.dependsOn serviceLoaderBuild
shadowJar.dependsOn serviceLoaderBuild
shadowJar {
	archiveClassifier = ''
    mergeServiceFiles()
    destinationDirectory = file( "build/libs" )
}

/**
 * Source Code Formatting
 */
spotless {
    java {
		target fileTree( "." ) {
            include "**/*.java"
            exclude "**/build/**", "bin/**", "examples/**"
        }
        eclipse().configFile( "./.ortus-java-style.xml" )
		toggleOffOn()
    }
}

/**
 * Custom task that creates a build/module folders
 * - Copies the build/libs/bx-lens-*.jar to build/modules/bx-lens/libs/
 * - Copies the src/main/bx/** to build/modules/bx-lens/ folder.
 */
def bxAiVersion = '3.6.0-snapshot'
/**
 * BoxLang AI (bx-ai) ships inside this module as a nested module (module inception: the modules folder of a module).
 * <p>
 * It is the snapshot build of bx-ai (its development branch), because the MCP client controls Lens needs (withUrlGuard, withRedirects,
 * withMaxResponseBytes, withHandshake, withHttpVersion, the timeout in milliseconds, listTools( cursor )) are not in a release yet. The snapshot is
 * built and published by the bx-ai repository on every push to development, so it changes and cannot be pinned by a checksum.
 * When a bx-ai release has them: set bxAiVersion to that release and set bxAiSha256 to its SHA-256, which turns the check on again.
 */
task downloadBxAi( type: Download ) {
	src "https://downloads.ortussolutions.com/ortussolutions/boxlang-modules/bx-ai/${bxAiVersion}/bx-ai-${bxAiVersion}.zip"
	dest file( "build/cache/bx-ai-${bxAiVersion}.zip" )
	// A snapshot changes: ask the server each time and download only when it is newer
	overwrite true
	onlyIfModified true
}

// The archive is bundled into the module, so a release is checked against the one this build was written against. A snapshot has no checksum.
def bxAiSha256 = ''
task verifyBxAi( type: Verify ) {
	dependsOn downloadBxAi
	onlyIf { !bxAiSha256.isEmpty() }
	src file( "build/cache/bx-ai-${bxAiVersion}.zip" )
	algorithm 'SHA-256'
	checksum bxAiSha256
}

task createModuleStructure(type: Copy) {
	dependsOn downloadBxAi, verifyBxAi
	mustRunAfter shadowJar, jar
    from( 'build/libs' ) {
		include "${project.name}-${version}.jar"
        into 'libs'
    }
    from( zipTree( file( "build/cache/bx-ai-${bxAiVersion}.zip" ) ) ) {
        into 'modules/bxai'
    }
    from( 'src/main/bx/assets' ) {
        include '**/*.js', '**/*.css', '**/*.svg', '**/*.html', '**/*.txt'
        into 'assets'
    }
    // The pages the ops agent searches (assets/docs). Only what helps an operator
    from( 'docs' ) {
        include 'features.md', 'configuration.md', 'licensing.md', 'security.md', 'troubleshooting.md', 'faq.md'
        include 'console/*.md', 'reference/*.md', 'guides/production.md', 'guides/ollama.md'
        into 'assets/docs'
    }
    from( 'src/main/bx' ) {
		include '**/*.bx', '**/*.bxm'
		// Token Replacements Go Here
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }
    from( '.' ) {
        include 'box.json'
		include 'LICENSE'
		include 'readme.md'
		include 'changelog.md'
		// Token Replacements Go Here
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }

    destinationDir = file( "build/modules/${project.name}" )
}
task zipModuleStructure( type: Zip ) {
    group = "distribution"
    from createModuleStructure.destinationDir
    archiveFileName = "${project.name}-${version}.zip"
    destinationDirectory = file( "$buildDir/distributions" )
    // Output that the module has been zippped
    doLast {
        println "+ Module has been zipped to the distribution folder"
    }
}
createModuleStructure.finalizedBy( zipModuleStructure )
shadowJar.finalizedBy( createModuleStructure )
// The integration tests load the packaged module from build/modules, so a clean checkout must have it built before they run
createModuleStructure.dependsOn( shadowJar )
test.dependsOn( createModuleStructure )

test {
    useJUnitPlatform()
    testLogging {
		showStandardStreams = true
	}
	classpath = classpath.filter { !it.path.contains( "build${File.separator}resources" ) }
}

/**
 * TEMPORARY until we publish to maven
 * Task to download the latest jar from https://ortus-temp.s3.amazonaws.com/jericho/libs/boxlang-1.0.0.jar
 */
task downloadBoxLang( type: Download ) {
	// Create the destination directory
	doFirst {
		file( "src/test/resources/libs" ).mkdirs()
	}
    // The runtime and web support (compile only)
    src( [
		"https://downloads.ortussolutions.com/ortussolutions/boxlang/${boxlangVersion}/boxlang-${boxlangVersion}.jar",
		"https://downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-web-support/${boxlangVersion}/boxlang-web-support-${boxlangVersion}.jar"
	] )
    dest "src/test/resources/libs/"
    overwrite true
    onlyIfModified false
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.0"
	} else if( major ){
		newVersion = "${newPathVersion}.0.0"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}
